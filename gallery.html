<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Gallery — The Archive</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&family=Caveat:wght@400;500&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <!-- ================================
         NAVIGATION
         ================================ -->

    <aside class="sidebar">

        <div class="brand">

            <span class="brand-title">
                THE ARCHIVE
            </span>

            <span class="brand-subtitle">
                A collection of moments.
            </span>

        </div>


        <nav class="navigation">

            <a
                href="index.html"
                class="nav-link"
            >
                Home
            </a>


            <a
                href="story.html"
                class="nav-link"
            >
                Our Story
            </a>


            <a
                href="gallery.html"
                class="nav-link active"
                aria-current="page"
            >
                The Gallery
            </a>


            <a
                href="places.html"
                class="nav-link"
            >
                Places We've Been
            </a>


            <a
                href="things.html"
                class="nav-link"
            >
                Things I Love About You
            </a>


            <a
                href="tree.html"
                class="nav-link"
            >
                The Growing Tree
            </a>

        </nav>


        <div class="sidebar-bottom">

            <button
                id="randomMemory"
                class="random-button"
                type="button"
            >
                ↻ Random Memory
            </button>


            <div class="memory-counter">

                <span id="memoryCount">
                    0
                </span>

                <span>
                    memories preserved
                </span>

            </div>

        </div>

    </aside>


    <!-- ================================
         MOBILE HEADER
         ================================ -->

    <header class="mobile-header">

        <span>
            THE ARCHIVE
        </span>

        <button
            id="menuButton"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
        >
            ☰
        </button>

    </header>


    <!-- ================================
         GALLERY
         ================================ -->

    <main class="main-content gallery-page">

        <section class="gallery-header">

            <p class="handwritten">
                The moments we kept.
            </p>

            <h1>
                The Gallery
            </h1>

            <p class="hero-description">
                Photographs gathered from the memories
                that became part of our story.
            </p>

        </section>


        <!-- ================================
             GALLERY CONTENT
             Generated by script.js
             ================================ -->

        <section
            id="gallery"
            class="gallery"
            aria-label="Memory gallery"
        >

            <p class="loading">
                Opening the gallery...
            </p>

        </section>

    </main>


    <!-- ================================
         LIGHTBOX
         ================================ -->

    <div
        id="lightbox"
        class="lightbox"
        aria-hidden="true"
    >

        <button
            id="lightboxPrev"
            class="lightbox-nav lightbox-prev"
            type="button"
            aria-label="Previous media"
        >
            ‹
        </button>


        <button
            id="lightboxClose"
            class="lightbox-close"
            type="button"
            aria-label="Close viewer"
        >
            ×
        </button>


        <button
            id="lightboxNext"
            class="lightbox-nav lightbox-next"
            type="button"
            aria-label="Next media"
        >
            ›
        </button>


        <div class="lightbox-content">

            <!-- Photograph viewer -->

            <img
                id="lightboxImage"
                src=""
                alt=""
            >


            <!-- Video viewer -->

            <video
                id="lightboxVideo"
                controls
                playsinline
                preload="metadata"
                hidden
            >
            </video>


            <!-- Caption -->

            <div
                id="lightboxCaption"
                class="lightbox-caption"
            ></div>

        </div>

    </div>


    <!-- ================================
         JAVASCRIPT
         ================================ -->

    <script src="./script.js?v=21"></script>

</body>

    </html>
